<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; touch-action: manipulation; }
        .oculto { display: none !important; }
        .visible { display: flex !important; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        
        /* Estilos Portada Nueva */
        .hero-side {
            background-image: url('portada.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(30, 58, 138, 0.7); /* Azul translúcido */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
        }

        .loading-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(2px); }
        .card-hover:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border-color: #3b82f6; }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #1e293b; color: white; padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); border-left: 4px solid #3b82f6; animation: slideIn 0.3s ease-out; font-size: 14px; display: flex; align-items: center; gap: 10px; min-width: 300px; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .tooltip { position: relative; display: inline-block; }
        .tooltip .tooltiptext { visibility: hidden; width: 120px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; margin-left: -60px; opacity: 0; transition: opacity 0.3s; font-size: 10px; }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-950">

    <div id="toast-container"></div>

    <div id="loader" class="loading-overlay">
        <div class="text-center">
            <i class="fas fa-circle-notch fa-spin text-4xl text-blue-500 mb-4"></i>
            <p class="text-white font-bold">Conectando...</p>

    <div id="vista-pass" class="oculto fixed inset-0 z-50 w-full h-full flex bg-white fade-in">

            </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-center p-8 md:p-20 bg-white relative">
            <div class="absolute top-10 right-10 text-slate-900 font-black text-xl tracking-tight">LABSE</div>
            
            <div class="max-w-md w-full mx-auto">
                <h2 class="text-4xl font-bold text-slate-900 mb-2">Bienvenido</h2>
                <p class="text-slate-500 mb-10">Inicie sesión para continuar</p>
                
                <form onsubmit="verificarPassword(event)" class="flex flex-col gap-4">
                    <div class="relative">
                        <input type="password" id="sys-pass" placeholder="Contraseña de acceso" 
                            class="w-full bg-slate-50 text-slate-900 border border-slate-200 rounded-xl py-4 px-6 outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10">
                    </div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition transform active:scale-[0.98] text-lg uppercase tracking-wide">
                        Ingresar
                    </button>
                    <a href="#" class="text-right text-sm text-slate-400 hover:text-blue-600 transition">Olvidé mi contraseña</a>
                </form>
            </div>
        </div>
    </div>

    <div id="vista-roles" class="oculto fixed inset-0 z-40 w-full h-full bg-slate-950 items-center justify-center flex-col fade-in p-6">
        <div class="text-center mb-8"><h2 class="text-3xl font-bold text-white">Seleccionar Perfil</h2></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl w-full px-4">
            <button onclick="irALoginAdmin()" class="group bg-slate-900 border border-slate-800 p-8 rounded-3xl hover:border-blue-500/50 flex flex-col items-center gap-4 text-center cursor-pointer shadow-xl transition-all">
                <i class="fas fa-user-cog text-4xl text-blue-400 group-hover:scale-110 transition"></i>
                <div><h3 class="text-xl font-bold text-white">Administración</h3><p class="text-slate-400 text-xs mt-1">Gestión total</p></div>
            </button>
            <button onclick="seleccionarRol('visita')" class="group bg-slate-900 border border-slate-800 p-8 rounded-3xl hover:border-emerald-500/50 flex flex-col items-center gap-4 text-center cursor-pointer shadow-xl transition-all">
                <i class="fas fa-search text-4xl text-emerald-400 group-hover:scale-110 transition"></i>
                <div><h3 class="text-xl font-bold text-white">Consulta</h3><p class="text-slate-400 text-xs mt-1">Ver Stock</p></div>
            </button>
            <button onclick="seleccionarRol('operario')" class="group bg-slate-900 border border-slate-800 p-8 rounded-3xl hover:border-purple-500/50 flex flex-col items-center gap-4 text-center cursor-pointer shadow-xl transition-all">
                <i class="fas fa-tasks text-4xl text-purple-400 group-hover:scale-110 transition"></i>
                <div><h3 class="text-xl font-bold text-white">Instrumentación</h3><p class="text-slate-400 text-xs mt-1">Tareas</p></div>
            </button>
        </div>
        <button onclick="volverAlBloqueo()" class="mt-12 text-slate-500 hover:text-white text-sm transition"><i class="fas fa-arrow-left"></i> Volver</button>
    </div>
